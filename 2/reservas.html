<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu mesa - Café Aroma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&family=Open+Sans:ital,wght@0,400;0,700;1,400&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --negro: #140e0c; --panel: #2a1a14; --linea: #4a2f22; --oro: #e6c28f; --crema: #f4e8d6; --tostado: #b98b62; }
        body { font-family: "Open Sans", Arial, sans-serif; background: var(--negro); color: var(--crema); line-height: 1.6; min-height: 100vh; padding: 28px 16px 48px; }
        a { color: inherit; }
        :focus-visible { outline: 3px solid var(--oro); outline-offset: 3px; }

        /* ---------- Fondo: café humeante ---------- */
        .fondo { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-color: #140e0c;
            background-image: linear-gradient(rgba(20,14,12,.25), rgba(20,14,12,.25)), url("img/fondo-pagina.jpg");
            background-size: cover; background-position: center; background-repeat: no-repeat; }

        /* ---------- Panel principal ---------- */
        .container { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 40px 36px 36px; text-align: center;
            background: rgba(24,15,12,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--linea); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
        .back { display: inline-block; margin-bottom: 18px; color: var(--oro); font-size: .95em; text-decoration: none; }
        .back:hover { text-decoration: underline; }
        .logo { width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 14px; background: var(--panel); padding: 6px; display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; }
        h1 { font-family: "Lobster", Georgia, cursive; font-weight: 400; font-size: clamp(2.6rem, 7vw, 3.8rem); line-height: 1.05; color: var(--oro); margin-bottom: 12px; }
        h2 { font-family: "Lobster", Georgia, cursive; font-weight: 400; font-size: 1.7rem; color: var(--oro); margin-bottom: 8px; }
        .section-title { font-family: "Lobster", Georgia, cursive; font-size: 1.7rem; color: var(--oro); margin-top: 30px; }
        .hint { color: #cdb89a; font-size: .95em; margin: 6px auto 14px; max-width: 60ch; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        .status { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: .88em; font-weight: 700; margin-bottom: 12px; background: #3b2a20; color: var(--crema); }
        .status.abierto { background: #1f3d22; color: #bfe8b8; }
        .status.cerrado { background: #4a1f1a; color: #f3b9b0; }

        /* ---------- Botones ---------- */
        button { font-family: inherit; font-size: .95em; font-weight: 700; padding: 10px 24px; border: 0; border-radius: 999px; background: var(--oro); color: #2a1810; cursor: pointer; transition: background .25s; }
        button:hover { background: #f3d6a8; }
        button:disabled { background: #4a382c; color: #9b8873; cursor: not-allowed; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 16px 0; }
        .actions button { flex: 1 1 150px; }

        /* ---------- Carta ---------- */
        .toolbar { display: flex; gap: 10px; margin: 16px 0 10px; }
        .toolbar input { flex: 1 1 55%; }
        .toolbar select { flex: 1 1 45%; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
        button.chip { background: transparent; color: var(--crema); border: 2px solid var(--tostado); padding: 7px 16px; }
        button.chip:hover { background: rgba(185,139,98,.25); }
        button.chip.activo { background: var(--tostado); color: #2a1810; }
        .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0; }
        .card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 10px; background: var(--panel); border: 1px solid var(--linea); border-radius: 14px; transition: border-color .25s; }
        .card:hover { border-color: var(--oro); }
        .card a { color: var(--oro); text-decoration: none; font-size: 1.05em; }
        .card a:hover { text-decoration: underline; }
        .card button { margin-top: 8px; padding: 7px 18px; }
        .card-precio { font-weight: 700; font-size: 1.15em; }
        .card-etiqueta { font-size: .78em; color: #f3b9b0; }
        .card-cantidad { font-size: .82em; color: #cdb89a; min-height: 1.1em; }
        .vacio { color: #cdb89a; padding: 14px 0; }

        .order { background: var(--panel); border: 1px solid var(--linea); border-radius: 14px; padding: 20px 20px 16px; margin: 22px 0 14px; text-align: left; }
        .order h2 { text-align: center; }
        .cart-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--linea); }
        .cart-nombre { flex: 1 1 auto; }
        .cart-control { display: flex; align-items: center; gap: 8px; }
        button.mini { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 17px; line-height: 1; }
        .cart-cant { min-width: 20px; text-align: center; font-weight: 700; }
        .cart-sub { min-width: 56px; text-align: right; }
        .total { font-size: 1.35em; font-weight: 700; text-align: right; margin-top: 12px; color: var(--oro); }
        .aviso { color: #f3b9b0; font-size: .88em; margin-top: 10px; }
        .mensaje { color: #bfe8b8; font-weight: 700; text-align: center; margin-top: 10px; min-height: 1.2em; }

        /* ---------- Formulario de reservas ---------- */
        form { text-align: left; margin: 22px 0; }
        .field { margin-bottom: 16px; }
        label, legend { display: block; font-weight: 700; font-size: .95em; margin-bottom: 6px; color: var(--crema); }
        legend { color: var(--oro); padding: 0 8px; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="date"], input[type="search"], select, textarea {
            width: 100%; padding: 11px 14px; font-size: 1em; font-family: inherit; color: var(--crema);
            background: var(--panel); border: 2px solid var(--linea); border-radius: 10px; color-scheme: dark; }
        input::placeholder, textarea::placeholder { color: #a8927a; }
        input:focus, select:focus, textarea:focus { border-color: var(--oro); outline: none; }
        select option { background: #2a1a14; color: var(--crema); }
        textarea { resize: vertical; min-height: 84px; }
        .invalido { border-color: #e2685a; }
        fieldset { border: 2px solid var(--linea); border-radius: 10px; padding: 12px 16px 8px; margin-bottom: 16px; }
        fieldset.invalido { border-color: #e2685a; }
        .error { color: #f3a79b; font-size: .85em; margin-top: 4px; min-height: 1.2em; }
        .opcion { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .opcion input { width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--oro); }
        .opcion label { margin: 0; font-weight: 400; }
        .contador-letras { color: #a8927a; font-size: .8em; text-align: right; }
        .confirmacion { background: #3b2a20; border-left: 4px solid var(--oro); border-radius: 10px; padding: 18px; margin: 20px 0; line-height: 1.5; text-align: left; }
        .reserva-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: .92em; text-align: left; }

        @media (max-width: 560px) {
            body { padding: 14px 10px 30px; }
            .container { padding: 28px 18px; }
            .menu { grid-template-columns: repeat(2, 1fr); }
            .toolbar { flex-direction: column; }
            .reserva-item { flex-direction: column; align-items: flex-start; }
        }

    </style>
</head>
<body>
    <div class="fondo" aria-hidden="true">
    </div>
    <div class="container">
        <a class="back" href="cafe-aroma.html">← Volver al inicio</a>
        <div class="logo">☕</div>
        <h1>Reserva tu mesa</h1>
        <p class="status" id="estado-cafeteria"></p>
        <p class="hint">Atendemos de 8:00 a. m. a 8:00 p. m. Puedes reservar cada 30 minutos, hasta las 7:30 p. m.</p>

        <!-- novalidate: las revisiones las hace nuestro script, con mensajes propios -->
        <form id="formulario" novalidate>

            <div class="field">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" autocomplete="name" placeholder="Ej. Ana Torres">
                <p class="error" id="error-nombre" aria-live="polite"></p>
            </div>

            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" autocomplete="email" placeholder="nombre@correo.com">
                <p class="error" id="error-correo" aria-live="polite"></p>
            </div>

            <div class="field">
                <label for="celular">Celular</label>
                <input type="tel" id="celular" autocomplete="tel" inputmode="numeric" placeholder="987 654 321">
                <p class="error" id="error-celular" aria-live="polite"></p>
            </div>

            <div class="field">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha">
                <p class="error" id="error-fecha" aria-live="polite"></p>
            </div>

            <div class="field">
                <label for="hora">Hora</label>
                <select id="hora"></select>
                <p class="error" id="error-hora" aria-live="polite"></p>
            </div>

            <div class="field">
                <label for="personas">¿Cuántas personas?</label>
                <select id="personas"></select>
                <p class="error" id="error-personas" aria-live="polite"></p>
            </div>

            <fieldset id="motivo">
                <legend>Motivo de tu visita</legend>
                <div class="opcion">
                    <input type="radio" name="motivo" id="motivo-amigos" value="Charla con amigos o familia">
                    <label for="motivo-amigos">Charla con amigos o familia</label>
                </div>
                <div class="opcion">
                    <input type="radio" name="motivo" id="motivo-estudio" value="Estudiar o trabajar">
                    <label for="motivo-estudio">Estudiar o trabajar</label>
                </div>
                <div class="opcion">
                    <input type="radio" name="motivo" id="motivo-celebracion" value="Celebración">
                    <label for="motivo-celebracion">Celebración</label>
                </div>
                <div class="opcion">
                    <input type="radio" name="motivo" id="motivo-otro" value="Otro">
                    <label for="motivo-otro">Otro</label>
                </div>
                <p class="error" id="error-motivo" aria-live="polite"></p>
            </fieldset>

            <fieldset>
                <legend>¿Necesitas algo especial? (opcional)</legend>
                <div class="opcion">
                    <input type="checkbox" name="extra" id="extra-silla" value="Silla para bebé">
                    <label for="extra-silla">Silla para bebé</label>
                </div>
                <div class="opcion">
                    <input type="checkbox" name="extra" id="extra-rueda" value="Acceso para silla de ruedas">
                    <label for="extra-rueda">Acceso para silla de ruedas</label>
                </div>
                <div class="opcion">
                    <input type="checkbox" name="extra" id="extra-enchufe" value="Mesa cerca de un enchufe">
                    <label for="extra-enchufe">Mesa cerca de un enchufe</label>
                </div>
            </fieldset>

            <div class="field">
                <label for="bienvenida">Café de bienvenida (opcional)</label>
                <select id="bienvenida"></select>
            </div>

            <div class="field">
                <label for="comentarios">Comentarios (opcional)</label>
                <textarea id="comentarios" maxlength="200" placeholder="Ej. Llegaremos 10 minutos tarde."></textarea>
                <p class="contador-letras" id="contador-letras">0 / 200</p>
            </div>

            <div class="actions">
                <button type="reset" id="limpiar">Limpiar</button>
                <button type="submit">Reservar mesa</button>
            </div>
            <p class="error" id="error-general" aria-live="polite"></p>
        </form>

        <div class="confirmacion" id="confirmacion" role="status" style="display: none;"></div>

        <div id="bloque-reservas" style="display: none;">
            <p class="section-title">Tus reservas en este navegador</p>
            <div id="reservas"></div>
        </div>
    </div>

    <script src="cafes.js"></script>
    <script src="logo.js"></script>
    <script>
        /* ---------- 1. Elementos y datos ---------- */
        var formulario = document.getElementById('formulario');
        var campoNombre = document.getElementById('nombre');
        var campoCorreo = document.getElementById('correo');
        var campoCelular = document.getElementById('celular');
        var campoFecha = document.getElementById('fecha');
        var campoHora = document.getElementById('hora');
        var campoPersonas = document.getElementById('personas');
        var campoBienvenida = document.getElementById('bienvenida');
        var campoComentarios = document.getElementById('comentarios');
        var cajaConfirmacion = document.getElementById('confirmacion');

        var CLAVE_RESERVAS = 'cafeAromaReservas';
        var DIAS_ADELANTE = 60;
        var diasSemana = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
        var camposAValidar = ['nombre', 'correo', 'celular', 'fecha', 'hora', 'personas', 'motivo'];


        /* ---------- 2. Ayudas para fechas y horas ---------- */
        function dosDigitos(numero) {
            return (numero < 10 ? '0' : '') + numero;
        }

        // Date -> "2026-11-20" (hora local, el mismo formato del campo de fecha)
        function fechaTexto(fecha) {
            return fecha.getFullYear() + '-' + dosDigitos(fecha.getMonth() + 1) + '-' + dosDigitos(fecha.getDate());
        }

        function hoyTexto() {
            return fechaTexto(new Date());
        }

        function maximoTexto() {
            var limite = new Date();
            limite.setDate(limite.getDate() + DIAS_ADELANTE);
            return fechaTexto(limite);
        }

        // "16:30" -> "4:30 p. m."
        function horaBonita(texto) {
            var partes = texto.split(':');
            var h = parseInt(partes[0], 10);
            var h12 = h % 12;
            if (h12 === 0) {
                h12 = 12;
            }
            return h12 + ':' + partes[1] + (h < 12 ? ' a. m.' : ' p. m.');
        }

        // "2026-11-21" -> "sábado 21 de noviembre"
        function fechaBonita(texto) {
            var partes = texto.split('-');
            var fecha = new Date(parseInt(partes[0], 10), parseInt(partes[1], 10) - 1, parseInt(partes[2], 10));
            return diasSemana[fecha.getDay()] + ' ' + fecha.getDate() + ' de ' + nombresMes[fecha.getMonth()];
        }


        /* ---------- 3. Llenar las listas desplegables ---------- */

        // Horas: de 8:00 a 19:30 cada 30 minutos. Si la fecha es hoy, solo las que faltan (con 30 min de margen)
        function llenarHoras() {
            var anterior = campoHora.value;
            var ahora = new Date();
            var minutosAhora = ahora.getHours() * 60 + ahora.getMinutes();
            var esHoy = (campoFecha.value === hoyTexto());

            campoHora.innerHTML = '<option value="">Elige una hora</option>';

            for (var minutos = 8 * 60; minutos <= 19 * 60 + 30; minutos += 30) {
                if (esHoy && minutos < minutosAhora + 30) {
                    continue;
                }
                var valor = dosDigitos(Math.floor(minutos / 60)) + ':' + dosDigitos(minutos % 60);
                var opcion = document.createElement('option');
                opcion.value = valor;
                opcion.textContent = horaBonita(valor);
                campoHora.appendChild(opcion);
            }

            // si la hora elegida antes sigue disponible, se mantiene
            for (var k = 0; k < campoHora.options.length; k++) {
                if (campoHora.options[k].value === anterior) {
                    campoHora.selectedIndex = k;
                }
            }
        }

        function llenarPersonas() {
            campoPersonas.innerHTML = '<option value="">Elige</option>';
            for (var n = 1; n <= 8; n++) {
                var opcion = document.createElement('option');
                opcion.value = n;
                opcion.textContent = n + (n === 1 ? ' persona' : ' personas');
                campoPersonas.appendChild(opcion);
            }
        }

        // Café de bienvenida: solo cafés sin alcohol (el valor es la posición en "menu")
        function llenarBienvenida() {
            campoBienvenida.innerHTML = '<option value="">Sin pedido anticipado</option>';
            for (var i = 0; i < menu.length; i++) {
                if (!tieneEtiqueta(i, 'alcohol')) {
                    var opcion = document.createElement('option');
                    opcion.value = i;
                    opcion.textContent = menu[i] + ' (S/ ' + precios[i] + ')';
                    campoBienvenida.appendChild(opcion);
                }
            }
        }


        /* ---------- 4. Validación: un revisor por campo ---------- */
        function valorMotivo() {
            var opciones = document.getElementsByName('motivo');
            for (var i = 0; i < opciones.length; i++) {
                if (opciones[i].checked) {
                    return opciones[i].value;
                }
            }
            return '';
        }

        // Cada función devuelve un mensaje de error, o '' si el campo está bien
        var revisores = {
            nombre: function () {
                var v = campoNombre.value.trim();
                if (v === '') { return 'Escribe tu nombre.'; }
                if (v.length < 3) { return 'Escribe al menos 3 letras.'; }
                if (/\d/.test(v)) { return 'El nombre no puede tener números.'; }
                return '';
            },
            correo: function () {
                var v = campoCorreo.value.trim();
                if (v === '') { return 'Escribe tu correo.'; }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { return 'Escribe un correo válido, por ejemplo nombre@correo.com.'; }
                return '';
            },
            celular: function () {
                var v = campoCelular.value.replace(/\s/g, '');
                if (v === '') { return 'Escribe tu celular.'; }
                if (!/^9\d{8}$/.test(v)) { return 'Debe tener 9 dígitos y empezar con 9, por ejemplo 987 654 321.'; }
                return '';
            },
            fecha: function () {
                var v = campoFecha.value;
                if (v === '') { return 'Elige una fecha.'; }
                if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { return 'Escribe la fecha como AAAA-MM-DD.'; }
                if (v < hoyTexto()) { return 'Esa fecha ya pasó. Elige hoy o un día futuro.'; }
                if (v > maximoTexto()) { return 'Aceptamos reservas hasta con ' + DIAS_ADELANTE + ' días de anticipación.'; }
                return '';
            },
            hora: function () {
                if (campoHora.value !== '') { return ''; }
                if (campoFecha.value !== '' && campoHora.options.length === 1) {
                    return 'Hoy ya no quedan horarios. Elige otra fecha.';
                }
                return 'Elige una hora.';
            },
            personas: function () {
                if (campoPersonas.value === '') { return 'Elige cuántas personas serán.'; }
                return '';
            },
            motivo: function () {
                if (valorMotivo() === '') { return 'Elige el motivo de tu visita.'; }
                return '';
            }
        };

        function mostrarError(id, mensaje) {
            var campo = document.getElementById(id);
            document.getElementById('error-' + id).textContent = mensaje;

            if (mensaje !== '') {
                campo.classList.add('invalido');
            } else {
                campo.classList.remove('invalido');
            }
            if (campo.tagName !== 'FIELDSET') {
                campo.setAttribute('aria-invalid', mensaje !== '' ? 'true' : 'false');
            }
        }

        // Revisa un campo y muestra su error; devuelve true si está bien
        function validar(id) {
            var mensaje = revisores[id]();
            mostrarError(id, mensaje);
            return mensaje === '';
        }

        // Conecta un campo: revisa al salir de él y, si estaba mal, mientras se corrige
        function conectar(id) {
            var campo = document.getElementById(id);

            campo.addEventListener('blur', function () {
                validar(id);
            });

            function corregir() {
                if (campo.classList.contains('invalido')) {
                    validar(id);
                }
            }
            campo.addEventListener('input', corregir);
            campo.addEventListener('change', corregir);
        }

        for (var p = 0; p < camposAValidar.length; p++) {
            if (camposAValidar[p] !== 'motivo') {
                conectar(camposAValidar[p]);
            }
        }

        var opcionesMotivo = document.getElementsByName('motivo');
        for (var q = 0; q < opcionesMotivo.length; q++) {
            opcionesMotivo[q].addEventListener('change', function () {
                validar('motivo');
            });
        }

        // Al cambiar la fecha, se actualizan las horas disponibles
        campoFecha.addEventListener('change', function () {
            llenarHoras();
            if (document.getElementById('hora').classList.contains('invalido')) {
                validar('hora');
            }
        });

        // Contador de letras de los comentarios
        campoComentarios.addEventListener('input', function () {
            document.getElementById('contador-letras').textContent = campoComentarios.value.length + ' / 200';
        });


        /* ---------- 5. Guardar y leer reservas (localStorage) ---------- */
        function leerReservas() {
            var lista = [];
            try {
                var guardado = localStorage.getItem(CLAVE_RESERVAS);
                if (guardado) {
                    lista = JSON.parse(guardado);
                }
            } catch (error) {
                lista = [];
            }
            if (!Array.isArray(lista)) {
                lista = [];
            }
            return lista;
        }

        function guardarReservas(lista) {
            try {
                localStorage.setItem(CLAVE_RESERVAS, JSON.stringify(lista));
            } catch (error) {
                // si no se puede guardar, la reserva igual se confirma en pantalla
            }
        }

        function textoDeReserva(r) {
            var texto = fechaBonita(r.fecha) + ', ' + horaBonita(r.hora) + ' · ' + r.personas +
                        (r.personas === 1 ? ' persona' : ' personas') + ' · ' + r.nombre;
            return texto;
        }

        function dibujarReservas() {
            var lista = leerReservas();
            var contenedor = document.getElementById('reservas');
            contenedor.innerHTML = '';

            if (lista.length === 0) {
                document.getElementById('bloque-reservas').style.display = 'none';
                return;
            }
            document.getElementById('bloque-reservas').style.display = 'block';

            lista.sort(function (a, b) {
                var claveA = a.fecha + a.hora;
                var claveB = b.fecha + b.hora;
                if (claveA < claveB) { return -1; }
                if (claveA > claveB) { return 1; }
                return 0;
            });

            for (var i = 0; i < lista.length; i++) {
                var fila = document.createElement('div');
                fila.setAttribute('class', 'reserva-item');

                // textContent (y no innerHTML): así lo que escribió la persona nunca se interpreta como código
                var texto = document.createElement('span');
                texto.textContent = textoDeReserva(lista[i]);

                var cancelar = document.createElement('button');
                cancelar.setAttribute('type', 'button');
                cancelar.setAttribute('data-id', lista[i].id);
                cancelar.setAttribute('aria-label', 'Cancelar la reserva del ' + fechaBonita(lista[i].fecha) + ' a las ' + horaBonita(lista[i].hora));
                cancelar.textContent = 'Cancelar';

                fila.appendChild(texto);
                fila.appendChild(cancelar);
                contenedor.appendChild(fila);
            }
        }

        document.getElementById('reservas').addEventListener('click', function (evento) {
            var id = evento.target.getAttribute('data-id');
            if (id === null) {
                return;
            }

            var restantes = [];
            var lista = leerReservas();
            for (var i = 0; i < lista.length; i++) {
                if (String(lista[i].id) !== id) {
                    restantes.push(lista[i]);
                }
            }
            guardarReservas(restantes);
            cajaConfirmacion.style.display = 'none';
            dibujarReservas();
        });


        /* ---------- 6. Enviar el formulario ---------- */
        function limpiarErrores() {
            for (var i = 0; i < camposAValidar.length; i++) {
                mostrarError(camposAValidar[i], '');
            }
            document.getElementById('error-general').textContent = '';
        }

        formulario.addEventListener('submit', function (evento) {
            evento.preventDefault();                       // evita que la página se recargue

            var primerError = null;
            for (var i = 0; i < camposAValidar.length; i++) {
                var bien = validar(camposAValidar[i]);
                if (!bien && primerError === null) {
                    primerError = camposAValidar[i];
                }
            }

            if (primerError !== null) {
                document.getElementById('error-general').textContent = 'Revisa los campos marcados en rojo.';
                if (primerError === 'motivo') {
                    document.getElementById('motivo-amigos').focus();
                } else {
                    document.getElementById(primerError).focus();
                }
                return;
            }
            document.getElementById('error-general').textContent = '';

            // ¿Ya existe una reserva con el mismo correo, fecha y hora?
            var correo = campoCorreo.value.trim().toLowerCase();
            var reservas = leerReservas();
            for (var j = 0; j < reservas.length; j++) {
                if (reservas[j].fecha === campoFecha.value && reservas[j].hora === campoHora.value &&
                    String(reservas[j].correo).toLowerCase() === correo) {
                    mostrarError('hora', 'Ya tienes una reserva a esa hora con este correo.');
                    campoHora.focus();
                    return;
                }
            }

            // Juntamos los extras marcados
            var extras = [];
            var cajas = document.getElementsByName('extra');
            for (var k = 0; k < cajas.length; k++) {
                if (cajas[k].checked) {
                    extras.push(cajas[k].value);
                }
            }

            var reserva = {
                id: new Date().getTime(),
                nombre: campoNombre.value.trim(),
                correo: campoCorreo.value.trim(),
                celular: campoCelular.value.replace(/\s/g, ''),
                fecha: campoFecha.value,
                hora: campoHora.value,
                personas: parseInt(campoPersonas.value, 10),
                motivo: valorMotivo(),
                extras: extras,
                bienvenida: campoBienvenida.value,
                comentarios: campoComentarios.value.trim()
            };

            reservas.push(reserva);
            guardarReservas(reservas);

            // Mensaje de confirmación (textContent: seguro con lo que escribió la persona)
            var mensaje = '¡Listo, ' + reserva.nombre.split(' ')[0] + '! Reservamos una mesa para ' +
                          reserva.personas + (reserva.personas === 1 ? ' persona' : ' personas') +
                          ' el ' + fechaBonita(reserva.fecha) + ' a las ' + horaBonita(reserva.hora);

            if (reserva.bienvenida !== '') {
                mensaje += ' Tu ' + menu[reserva.bienvenida] + ' te espera cuando llegues.';
            }
            mensaje += ' Te esperamos en Iquique 127, Lima.';

            cajaConfirmacion.textContent = mensaje;
            cajaConfirmacion.style.display = 'block';

            formulario.reset();
            limpiarErrores();
            llenarHoras();
            document.getElementById('contador-letras').textContent = '0 / 200';
            dibujarReservas();
            cajaConfirmacion.scrollIntoView();
        });

        // "Limpiar" también borra los errores y repone las horas
        formulario.addEventListener('reset', function () {
            limpiarErrores();
            cajaConfirmacion.style.display = 'none';
            setTimeout(function () {
                llenarHoras();
                document.getElementById('contador-letras').textContent = '0 / 200';
            }, 0);
        });


        /* ---------- 7. Primer dibujo ---------- */
        campoFecha.setAttribute('min', hoyTexto());
        campoFecha.setAttribute('max', maximoTexto());
        llenarHoras();
        llenarPersonas();
        llenarBienvenida();
        dibujarReservas();
    </script>
</body>
</html>
